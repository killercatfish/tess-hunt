# tess-hunt configuration. Any threshold change MUST get a CHANGELOG.md line with the reason.

paths:
  data_dir: data                 # relative to repo root; holds cache/, catalogs/
  db: results.db
  candidates_dir: candidates
  report: report.html

resources:
  workers: 6                     # half of Cortex's 12 threads
  threads_per_worker: 1          # numba/OMP/BLAS threads per worker (avoid oversubscription)
  min_free_ram_gb: 6             # workers wait (not crash) while available RAM is below this
  cache_max_gb: 50               # LRU-evict raw FITS of fully processed stars above this

targets:
  pilot_size: 200
  teff_max: 5200
  teff_min: 2400
  dist_max_pc: 100
  tmag_max: 13
  dwarfs_only: true              # require TIC lumclass DWARF (logg-based)
  seed: 42                       # random sample of the eligible pool, reproducible
  require_2min: false            # if false, fall back to TESS-SPOC / QLP FFI products

download:
  authors: [SPOC, TESS-SPOC, QLP]   # preference order, one product per sector
  spoc_exptime: 120                 # ignore 20 s duplicates

prep:
  sigma_upper: 4.0               # clip upward outliers only; dips are never clipped
  window_mult: 3.0               # biweight window = window_mult * longest searched duration
  window_min_d: 0.5
  window_max_d: 1.5
  edge_cutoff_d: 0.0
  break_tolerance_d: 0.5

search:
  period_min_d: 0.5
  period_max_d: 40.0             # capped (CHANGELOG 2026-10-09); long-period/single-transit is a later mode
  bin_minutes: 10                # search on binned data; kill tests use full cadence
  oversampling: 3
  duration_grid_step: 1.1
  max_iterations: 4              # initial search + up to 3 masked re-searches
  mask_width_mult: 2.0           # mask 2x duration around found transits before re-search
  bls_max_periods: 100000        # BLS cross-check grid size (informational only; SDE always from full TLS)
  plot_rejected: false           # also draw diagnostics for threshold-passing signals that got killed

thresholds:
  sde_min: 9.0
  snr_min: 7.0
  min_transits: 3

kill_tests:
  period_match_tol: 0.01         # fractional; also checks x2, x1/2 aliases
  odd_even_sigma: 3.0
  secondary_sigma_half: 3.0      # at phase 0.5
  secondary_sigma_scan: 5.0      # anywhere in phase 0.3-0.7 (look-elsewhere penalty)
  duration_ratio_min: 0.2        # observed / expected (circular, b=0)
  duration_ratio_max: 1.6
  max_radius_rearth: 22.0        # ~2 R_Jup; bigger implies stellar companion
  shape_dchi2: 9.0               # V-shape favoured over U by this much -> fail
  shape_min_snr: 12.0            # below this, shape is inconclusive (pass)
  systematics_period_tol: 0.002  # fractional
  systematics_max_targets: 3     # period shared by more than N targets -> instrumental
  instrumental_periods_d: [13.7, 27.4]  # TESS orbit / sector; flag these and harmonics
  contamination_radius_arcsec: 42
  contamination_max_eclipse: 0.5 # deepest plausible eclipse on a neighbour
  sector_consistency_p: 0.0027   # chi2 p-value below this -> depths inconsistent (3 sigma)
  season_gap_d: 200
  holdout_min_seasons: 3
  holdout_hit_sigma: 2.0
  holdout_min_hit_frac: 0.5
  injection_period_tol: 0.01
  hard_fail: [harmonic, odd_even, secondary, duration, size, shape, systematics, sector_consistency, holdout, injection]
  soft_flag: [known, contamination]

audit:
  enabled: true
  backend: mac_claude            # mac_claude: scripts/audit_from_mac.sh (fresh read-only claude -p per survivor)
                                 # cortex_vlm: local model below (validation: misreads statistics; see validation/AUDIT_COMPARISON.md)
  endpoint: http://127.0.0.1:11434/v1/chat/completions
  model: qwen38                  # vision-capable; thinking disabled below (it spent 4000 tokens thinking otherwise)
  max_tokens: 1500
  extra_body: {chat_template_kwargs: {enable_thinking: false}}
  requester: tess.audit
  timeout_s: 600
